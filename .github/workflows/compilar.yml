name: Compilar APK Mundo Dron

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Instalar Java 17 (Motor Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Compilar APK (Esto tardará unos minutos)
        run: flet build apk

      - name: Subir APK final
        uses: actions/upload-artifact@v4
        with:
          name: MundoDron-APK
          path: build/apk/**/*.apk
