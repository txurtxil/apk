name: Compilar APK Mundo Dron

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar motor Flutter (¡Esto faltaba!)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Compilar el APK (Tardará unos minutos)
        run: flet build apk

      - name: Subir archivo instalable
        uses: actions/upload-artifact@v4
        with:
          name: MundoDron-APK
          path: build/apk/**/*.apk
